[package]
name = "haemwend"
version = "0.1.0"
edition = "2024"
default-run = "haemwend"

[dependencies]
bevy = "0.18.1"
bevy_egui = { version = "0.39.1", default-features = false, features = ["default_fonts", "render", "bevy_ui"] }
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }

[lints.clippy]
# Bevy injects system parameters and expresses query filters in tuple types.
too_many_arguments = "allow"
type_complexity = "allow"
